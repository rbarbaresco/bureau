name: Idea
description: A change or addition you would like
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: The outcome you want, not a design. If you have a design, give it one line.
    validations:
      required: true
